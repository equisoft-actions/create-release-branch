name: create-release-branch
description: |
  Automatically create release/vX.X.x branch for vX.X.0 tags

  This action should be used in a stand-alone workflow and triggered on `v*.*.0` tags.

  The secret for the PAT used to create the branch should be in an environment only accessible to protected branches.

  See README.md for sample.
  ```

inputs:
  github-token:
    description: Personal access token with repo access
    required: true
  release-branch:
    description: Branch allowed for release. Default to the repository default branch.
    required: false

runs:
  using: "composite"
  steps:
    - name: "Validate tagged commit"
      shell: bash
      run: |
        DEFAULT_BRANCH=${{ github.event.repository.default_branch }}
        RELEASE_BRANCH=${{ inputs.release-branch }}
        if [[ "$RELEASE_BRANCH" == "" ]]; then
          RELEASE_BRANCH="$DEFAULT_BRANCH"
        fi

        git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"

        if [ ! $? -eq 0 ] ; then
          echo ::error ::A release tag must point to a commit in the default branch.
          exit 1
        fi

    - name: "Create release branch"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const tagPattern = /^refs\/tags\/(v[^.]+\.[^.]+\.)0$/;
          if (!tagPattern.test(context.ref)) {
            core.setFailed(`This action must be triggered by a v*.*.0 tag, but got ref "${context.ref}".`);
            return;
          }

          const versionName = context.ref.replace(tagPattern, '$1x');
          const branch = `release/${versionName}`;
          const ref = `refs/heads/${branch}`;

          try {
            const existing = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });

            if (existing.data.object.sha === context.sha) {
              core.info(`Branch ${branch} already exists and points at ${context.sha}. Nothing to do.`);
            } else {
              core.warning(`Branch ${branch} already exists and points at ${existing.data.object.sha} (expected ${context.sha}). Leaving it untouched.`);
            }
            return;
          } catch (error) {
            if (error.status !== 404) {
              throw error;
            }
          }

          try {
            await github.rest.git.createRef({
              ref,
              sha: context.sha,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.info(`Created branch ${branch} at ${context.sha}.`);
          } catch (error) {
            if (error.status === 422) {
              core.setFailed(
                `Failed to create branch ${branch} (HTTP 422: ${error.message}). ` +
                `This usually means a repository ruleset or branch protection rule is blocking branch creation, ` +
                `a conflicting reference already exists, or the token lacks permission to create the branch. ` +
                `Ensure the token used has permission to create refs and can bypass any ruleset that restricts branch creation.`
              );
              return;
            }
            throw error;
          }
